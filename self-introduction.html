<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>自己紹介ページ</title>
  </head>
  <body>
    <h1>自己紹介</h1>
    <h2>プロフィール</h2>
    <p>名前:川口健吾</p>
    <p>年齢:27歳</p>
    <p>出身地:兵庫県</p>
    <p>趣味:ゲーム</p>
    <h2>好きなもの</h2>
    <ul>
      <li>ラーメン</li>
      <li>焼肉</li>
      <li>ネットフリックス</li>
    </ul>
    <h2>今年の目標</h2>
    <ol>
      <li>勉強時間を確保する</li>
      <li>解らないことを放置しない</li>
      <li>HTMLをマスターする</li>
    </ol>
    <h2>リンク</h2>
    <a href="https://github.com/kl-coder-ux/html-practice" target="_blank"
      >私のGit</a
    >
    <h2>好きな風景</h2>
    <img src="landscape.jpg" alt="好きな風景" width="400" />
    <h2>お問い合わせ</h2>
    <form action="/submit" method="POST">
      <label for="name">名前:</label>
      <input type="text" />
    </form>

    <label for="category">お問い合わせ</label>
    <select name="prefecture">
      <option value="">-- 選択してください --</option>
      <option value="tokyo">ありがとうございます！</option>
      <option value="osaka">こんにちは</option>
      <option value="aichi">hello</option>
    </select>

    <label for="contact">お問い合わせ内容</label>
    <textarea id="contact" name="contact" rows="7" cols="30"></textarea>
    <button type="submit">送信する</button>
  </body>
</html>
